services:
  # ANCHOR Backend Web Service
  - type: web
    name: anchor-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE
        value: mongo
      - key: MONGODB_URI
        value: mongodb+srv://dhakedayushkrl_db_user:jdXAIMs9js5xeK3M@shakti-2.2uziuij.mongodb.net/anchor?retryWrites=true&w=majority
      - key: MONGODB_DB_NAME
        value: anchor
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        value: shakti2_internal_key_for_n8n_webhooks
      - key: PORT
        value: 10000

  # ANCHOR Frontend Static Site
  - type: web
    name: anchor-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
