services:
  # ANCHOR Backend Web Service
  - type: web
    name: anchor-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE
        value: mongo
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: anchor
      - key: GEMINI_API_KEY
        sync: false

  # ANCHOR Frontend Static Site
  - type: web
    name: anchor-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
