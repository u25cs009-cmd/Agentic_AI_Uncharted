services:
  # ANCHOR Backend Web Service
  - type: web
    name: anchor-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE
        value: memory
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # ANCHOR Frontend Static Site
  - type: web
    name: anchor-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
